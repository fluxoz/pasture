[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pasture"
version = "0.1.0"
description = "Gateway for pasture: a passkey-gated PWA terminal and session dashboard"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["aiohttp", "cryptography", "webauthn"]

[project.scripts]
pasture-gateway = "pasture.__main__:main"
pasture = "pasture.cli:main"

[tool.setuptools]
packages = ["pasture", "pasture.providers"]
