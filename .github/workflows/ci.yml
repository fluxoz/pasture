# Every push: the Nix packages (the gateway's tests run in its build), and the
# test suite on Linux, macOS and Windows with plain Python.
name: ci
on:
  push:
  pull_request:
jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#gateway .#web .#pasture
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./gateway
      - run: python -m unittest discover -s tests -t . -v
        working-directory: gateway
